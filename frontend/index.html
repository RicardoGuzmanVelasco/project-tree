<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/logo.png?v=2" />
    <title>project-tree</title>
    <style>
      :root {
        /* Colors — Slate palette */
        --c-bg: #ffffff;
        --c-bg-subtle: #f8fafc;
        --c-bg-muted: #f1f5f9;
        --c-border: #e2e8f0;
        --c-border-strong: #cbd5e1;
        --c-text: #1e293b;
        --c-text-muted: #64748b;
        --c-text-faint: #94a3b8;

        /* Accent */
        --c-primary: #3b82f6;
        --c-primary-bg: #dbeafe;
        --c-primary-border: #93c5fd;
        --c-danger: #dc2626;
        --c-danger-bg: #fee2e2;
        --c-success: #10b981;
        --c-success-bg: #ecfdf5;
        --c-warning-bg: #fef3c7;
        --c-warning-border: #f59e0b;
        --c-purple: #9333ea;

        /* Spacing */
        --s-xs: 4px;
        --s-sm: 8px;
        --s-md: 12px;
        --s-lg: 16px;
        --s-xl: 24px;
        --s-toolbar-x: 40px;

        /* Radius */
        --r-sm: 4px;
        --r-md: 6px;
        --r-lg: 8px;
        --r-xl: 12px;
        --r-pill: 999px;

        /* Shadows */
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
        --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
        --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
        --shadow-xl: 0 12px 48px rgba(0,0,0,0.16);

        /* Transitions */
        --transition: 150ms ease;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; user-select: none; color: var(--c-text); }
      input, textarea, [contenteditable] { user-select: text; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
